<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Twibbon Kemerdekaan 17an Jindi</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      background: linear-gradient(135deg, #b7094c, #dc2626, #991b1b);
      color: #ffffff;
      text-align: center;
      padding: 20px 16px;
      border-bottom: 4px solid #fbbf24;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    header h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    header h1 span {
      color: #fef08a;
    }
    header p {
      font-size: 13px;
      color: #fecdd3;
      margin-top: 4px;
    }
    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 768px) {
      main {
        grid-template-columns: 380px 1fr;
        align-items: start;
      }
    }
    .canvas-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 9 / 16;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 25px -5px rgba(0,0,0,0.15);
      border: 4px solid #f59e0b;
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .canvas-wrapper.active-photo {
      touch-action: none;
    }
    .canvas-wrapper:active {
      cursor: grabbing;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #dc2626, #b7094c);
      color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.3);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-download {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      font-size: 16px;
      padding: 14px 20px;
      box-shadow: 0 10px 15px -3px rgba(22, 163, 74, 0.3);
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .range-group {
      background: #f8fafc;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .range-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      accent-color: #dc2626;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: #dc2626;
    }
    .badge {
      background: #fef2f2;
      color: #991b1b;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    .hidden {
      display: none;
    }
    .hint-text {
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header>
    <h1>Twibbon Kemerdekaan <span>17an</span></h1>
    <p>Aplikasi Twibbon Generator Portrait (9:16)</p>
  </header>

  <main>
    <div class="canvas-container">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="twibbonCanvas" width="1080" height="1920"></canvas>
      </div>
      <p class="hint-text">
        💡 <b>Tips HP:</b> Gunakan <b>1 jari</b> untuk geser foto, <b>2 jari</b> untuk Zoom.<br>
        <i>(Untuk scroll halaman down/up, sentuh latar abu-abu di luar frame)</i>
      </p>
    </div>

    <div class="controls-card">
      <div>
        <div class="section-title">1. Unggah Foto</div>
        <input type="file" id="uploadInput" accept="image/*" class="hidden">
        <button class="btn btn-primary" style="width:100%;" onclick="document.getElementById('uploadInput').click()">
          📁 Upload Foto Anda
        </button>
      </div>

      <div class="range-group">
        <div class="range-header">
          <span>2. Zoom Foto (Slider / Pinch)</span>
          <span class="badge" id="zoomValue">100%</span>
        </div>
        <input type="range" id="zoomRange" min="0.05" max="5" step="0.01" value="1">
      </div>

      <div>
        <div class="section-title">3. Tulis Quotes / Ucapan</div>
        <textarea id="quoteInput" rows="3" placeholder="Tulis ucapan/quotes kamu di sini... (Opsional)"></textarea>
      </div>

      <div>
        <div class="section-title">4. Putar & Reset</div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" style="flex:1;" id="rotateBtn">🔄 Putar 90°</button>
          <button class="btn btn-secondary" style="flex:1;" id="resetBtn">↩️ Reset</button>
        </div>
      </div>

      <button class="btn btn-download" id="downloadBtn">
        📥 Unduh Twibbon (PNG 1080x1920)
      </button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('twibbonCanvas');
    const ctx = canvas.getContext('2d');
    const uploadInput = document.getElementById('uploadInput');
    const zoomRange = document.getElementById('zoomRange');
    const zoomValue = document.getElementById('zoomValue');
    const quoteInput = document.getElementById('quoteInput');
    const rotateBtn = document.getElementById('rotateBtn');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const wrapper = document.getElementById('canvasWrapper');

    let userPhoto = null;
    let photoX = 0;
    let photoY = 0;
    let photoScale = 1;
    let photoRotation = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    // Multi-touch pinch zoom variables
    let initialPinchDistance = null;
    let initialScale = 1;

    // Load Frame Overlay
    const frameImg = new Image();
    frameImg.src = '17an Jindi Frame.png';
    frameImg.onload = render;

    // Helper: Gambar Kotak Putih Rounded
    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
      ctx.fill();
    }

    // Helper: Wrap Teks Quotes Otomatis
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let currentY = y;

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          context.fillText(line, x, currentY);
          line = words[n] + ' ';
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, currentY);
    }

    function render() {
      ctx.clearRect(0, 0, 1080, 1920);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 1080, 1920);

      // 1. Draw User Photo (Bottom Layer)
      if (userPhoto) {
        ctx.save();
        ctx.translate(1080 / 2 + photoX, 1920 / 2 + photoY);
        ctx.rotate((photoRotation * Math.PI) / 180);
        
        const w = userPhoto.width * photoScale;
        const h = userPhoto.height * photoScale;
        ctx.drawImage(userPhoto, -w / 2, -h / 2, w, h);
        ctx.restore();
      } else {
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Klik "Upload Foto Anda"', 540, 960);
      }

      // 2. Draw Frame Overlay (Middle Layer)
      if (frameImg.complete) {
        ctx.drawImage(frameImg, 0, 0, 1080, 1920);
      }

      // 3. Draw Quotes Box (Top Layer)
      const quoteText = quoteInput.value.trim();
      if (quoteText !== '') {
        ctx.save();
        const boxX = 430;
        const boxY = 1180;
        const boxW = 600;
        const boxH = 210;
        const radius = 24;

        // Background Putih
        ctx.fillStyle = '#ffffff';
        drawRoundedRect(ctx, boxX, boxY, boxW, boxH, radius);

        // Ikon Quotes "
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 110px Georgia, serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('“', boxX + 20, boxY + 15);

        // Teks Ucapan
        ctx.fillStyle = '#1e293b';
        ctx.font = '500 28px Georgia, serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        
        const textX = boxX + 115;
        const textY = boxY + 40;
        const maxTextWidth = boxW - 135;
        const lineHeight = 38;

        wrapText(ctx, quoteText, textX, textY, maxTextWidth, lineHeight);
        ctx.restore();
      }
    }

    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          userPhoto = img;
          photoX = 0;
          photoY = 0;
          photoRotation = 0;
          photoScale = Math.max(1080 / img.width, 1920 / img.height);
          zoomRange.value = photoScale;
          zoomValue.textContent = Math.round(photoScale * 100) + '%';
          wrapper.classList.add('active-photo');
          render();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    zoomRange.addEventListener('input', (e) => {
      photoScale = parseFloat(e.target.value);
      zoomValue.textContent = Math.round(photoScale * 100) + '%';
      render();
    });

    quoteInput.addEventListener('input', render);

    rotateBtn.addEventListener('click', () => {
      photoRotation = (photoRotation + 90) % 360;
      render();
    });

    resetBtn.addEventListener('click', () => {
      if (!userPhoto) return;
      photoX = 0;
      photoY = 0;
      photoRotation = 0;
      photoScale = Math.max(1080 / userPhoto.width, 1920 / userPhoto.height);
      zoomRange.value = photoScale;
      zoomValue.textContent = Math.round(photoScale * 100) + '%';
      quoteInput.value = '';
      render();
    });

    function getDistance(touches) {
      return Math.hypot(
        touches[0].clientX - touches[1].clientX,
        touches[0].clientY - touches[1].clientY
      );
    }

    // MOUSE EVENTS
    wrapper.addEventListener('mousedown', (e) => {
      if (!userPhoto) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || !userPhoto) return;
      const rect = canvas.getBoundingClientRect();
      const scaleFactor = 1080 / rect.width;

      photoX += (e.clientX - startX) * scaleFactor;
      photoY += (e.clientY - startY) * scaleFactor;
      startX = e.clientX;
      startY = e.clientY;
      render();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    wrapper.addEventListener('wheel', (e) => {
      if (!userPhoto) return;
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.05 : 0.05;
      let newScale = photoScale + delta;
      newScale = Math.min(Math.max(newScale, 0.05), 5);
      photoScale = newScale;
      zoomRange.value = photoScale;
      zoomValue.textContent = Math.round(photoScale * 100) + '%';
      render();
    }, { passive: false });

    // TOUCH EVENTS
    wrapper.addEventListener('touchstart', (e) => {
      if (!userPhoto) return;

      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = getDistance(e.touches);
        initialScale = photoScale;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!userPhoto) return;

      if (e.touches.length === 1 && isDragging) {
        if (wrapper.contains(e.target)) {
          if (e.cancelable) e.preventDefault();
        }
        const rect = canvas.getBoundingClientRect();
        const scaleFactor = 1080 / rect.width;
        const x = e.touches[0].clientX;
        const y = e.touches[0].clientY;

        photoX += (x - startX) * scaleFactor;
        photoY += (y - startY) * scaleFactor;
        startX = x;
        startY = y;
        render();
      } else if (e.touches.length === 2 && initialPinchDistance) {
        if (wrapper.contains(e.target)) {
          if (e.cancelable) e.preventDefault();
        }
        const currentDistance = getDistance(e.touches);
        if (initialPinchDistance > 0) {
          const pinchRatio = currentDistance / initialPinchDistance;
          let newScale = initialScale * pinchRatio;
          newScale = Math.min(Math.max(newScale, 0.05), 5);

          photoScale = newScale;
          zoomRange.value = photoScale;
          zoomValue.textContent = Math.round(photoScale * 100) + '%';
          render();
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
      if (e.touches.length === 0) {
        isDragging = false;
      }
    });

    // Download Function
    downloadBtn.addEventListener('click', () => {
      if (!userPhoto) {
        alert('Silakan upload foto Anda terlebih dahulu!');
        return;
      }
      const link = document.createElement('a');
      link.download = 'Twibbon-Jindi-17an.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    });

    render();
  </script>
</body>
</html>
